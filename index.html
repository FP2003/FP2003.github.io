    homeYaw = mobile ? 0 : -.35; // desktop: face angled toward the nav
    const nav = $('nav').getBoundingClientRect(), brand = $('.brand').getBoundingClientRect();
    L.home = mobile ? fit({ l: 0, r: w, t: brand.bottom + 8, b: nav.top - 8 }, DEVICE, .92)
                    : fit({ l: nav.right + 30, r: w - 20, t: 20, b: h - 70 }, DEVICE, .9);
    // scale where the screen (at z = FRONT * s, so nearer the camera as it grows) spans F of the view. Mobile: covers it (+8% hides
    // its rounded corners); desktop: fits inside it, so the orange and sky stay visible round the edges, and #panel matches the screen
    const tn = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), A = w / h, F = mobile ? 1 : ZOOM;
    const sh = 2 * tn * F * CAM_Z / (1.08 + 2 * tn * F * FRONT), sw = 2 * tn * F * CAM_Z * A / (1.38 + 2 * tn * F * FRONT * A);
    const s = mobile ? 1.08 * Math.max(sh, sw) : Math.min(sh, sw);
    L.cover = { s, x: 0, y: -SCR_Y * s };
    const px = 1.08 * s / (2 * tn * (CAM_Z - FRONT * s)) * h; // screen height on the page
    panel.style.cssText = mobile ? '' : `--pw:${px * 1.38 / 1.08}px;--ph:${px}px;--pr:${px * .08 / 1.08}px`;
  }

  // pointer: drag the orange to orbit the camera around it; click the D-pad / buttons / screen
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hitables = [body, screen, dpad, btnA, btnB];
  const orbit = { yaw: 0, pitch: 0 }, q = new THREE.Quaternion(), eul = new THREE.Euler(0, 0, 0, 'YXZ');
  let drag = null, tw = null; // tw = running zoom tween
  const hit = e => { ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); return ray.intersectObjects(hitables, false)[0]; };
  canvas.addEventListener('pointermove', e => {
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) < 4) return; // still a click
      Object.assign(drag, { moved: true, x: e.clientX, y: e.clientY });
      orbit.yaw += dx * .008; orbit.pitch = clamp(orbit.pitch + dy * .008, -1.2, 1.2);
      return;
    }
    const o = route === 'home' && !tw && hit(e)?.object;
    canvas.style.cursor = !o ? '' : o === body ? 'grab' : 'pointer';
  });
  const endDrag = click => {
    if (click && drag && !drag.moved && drag.screen && route === 'home') pressA();
    drag = null; canvas.style.cursor = '';
  };
  canvas.addEventListener('pointerup', () => endDrag(true));
  canvas.addEventListener('pointercancel', () => endDrag(false));
  canvas.addEventListener('pointerdown', e => {
    const o = e.button === 0 && route === 'home' && !tw && hit(e)?.object;
    if (!o) return;
    if (o === dpad) {
      const p = dpad.worldToLocal(hit(e).point), horiz = Math.abs(p.x) > Math.abs(p.y);
      fx('dpad', horiz ? [Math.sign(p.x), 0] : [0, Math.sign(p.y)]);
      move(horiz ? Math.sign(p.x) : -Math.sign(p.y));
    } else if (o === btnA) { fx('a'); pressA(); }
    else if (o === btnB) { fx('b'); pressB(); }
    else { drag = { x: e.clientX, y: e.clientY, moved: false, screen: o === screen }; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; }
  });

  // zoom: tween position, scale and camera orbit together; zooming in ends with the screen filling the viewport
  const ease = p => p < .5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2;
  zoomTo = next => {
    const into = next !== 'home';
    drag = null;
    tw = { into, t0: now(), dur: into ? 2.6 : 1.1, from: { ...cur, yaw: Math.atan2(Math.sin(orbit.yaw), Math.cos(orbit.yaw)), pitch: orbit.pitch } };
    Object.assign(scr, { state: into ? 'in' : 'out', p: 0 });
  };

  let last = now(), bob = 0, spin = 0, spinT0 = -1, restYaw = 0;
  function frame() {
    const t = now(), dt = Math.min(t - last, .05), k = 1 - Math.exp(-dt * 4.5);
    last = t;
    if (spinT0 >= 0) { const p = clamp((t - spinT0) / .9, 0, 1); spin = -TAU * (1 - ease(p)); if (p === 1) spinT0 = -1; } // intro spin
    const T = route === 'home' ? L.home : L.cover;
    restYaw = route === 'home' ? homeYaw : 0; // the orbit without any drag: where the void's city is anchored
    if (tw) {
      const p = clamp((t - tw.t0) / tw.dur, 0, 1), e = ease(tw.into ? Math.min(1, p / .6) : p), f = tw.from, yaw = tw.into ? 0 : homeYaw;
      restYaw = yaw - (yaw - (tw.into ? homeYaw : 0)) * (1 - e);
      for (const key of ['x', 'y', 's']) cur[key] = f[key] + (T[key] - f[key]) * e;
      orbit.yaw = f.yaw + (yaw - f.yaw) * e; orbit.pitch = f.pitch * (1 - e);
      scr.p = p;
      if (!tw.into && p > .6 && document.body.classList.contains('zoom')) showHome();
      if (p === 1) { if (tw.into) showView(); else scr.state = 'saver'; tw = null; }
    } else for (const key of ['x', 'y', 's']) cur[key] += (T[key] - cur[key]) * k; // follows resizes
    bob += ((route === 'home' && !tw && !reduced ? 1 : 0) - bob) * k;
    device.position.set(cur.x, cur.y + Math.sin(t * 1.4) * .05 * cur.s * bob, 0);
    device.scale.setScalar(cur.s);
    device.rotation.set(0, spin, 0);
    // orbit the whole camera rig around the orange, so it stays put on the page while the view turns
    q.setFromEuler(eul.set(-orbit.pitch, -orbit.yaw, 0));
    camera.position.set(0, 0, CAM_Z).sub(device.position).applyQuaternion(q).add(device.position);
    camera.quaternion.copy(q);
    for (const b of Object.values(pads)) {
      const u = b.userData; u.p = Math.max(0, u.p - dt * 6);
      b.position.z = u.z - u.p * .045;
      if (b === dpad) b.rotation.set(-u.dir[1] * u.p * .18, u.dir[0] * u.p * .18, 0);
    }
    drawScreen(); tex.needsUpdate = true;
    if (!reduced) animateVoid(t, dt);
    scene.updateMatrixWorld();
    // city deep in the void, on the line through the screen centre from where the eye rests (not where it is), so it sits centred
    // but dragging the orange swings the window off it, like looking past a window frame
    q.setFromEuler(eul.set(0, -restYaw, 0));
    screen.worldToLocal(eye.set(0, 0, CAM_Z).sub(device.position).applyQuaternion(q).add(device.position));
    // zooming in: dive down the line into the city, pitching to look straight down its centre shaft, past the floor into the black
    const zin = scr.state === 'in' ? scr.p : 0, dive = clamp((zin - .15) / .75, 0, 1) ** 3;
    tilt.rotation.x = Math.PI / 2 - .3 * (1 - ramp(.1, .6, zin));
    tilt.position.copy(eye).multiplyScalar(-(VOID_Z - (VOID_Z + eye.z + 1.5) * dive) / eye.z);
    roomCam.position.copy(screen.worldToLocal(eye.copy(camera.position)));
    voidKey.target.position.copy(tilt.position); voidKey.position.copy(tilt.position).add(V3(-4, 2, 3));
    frameCorners(roomCam, ...corners);
    // three sizes points off the canvas height, not the render target's: rescale so each trail dot is .28 void units wide
    trailMat.size = .28 * rt.height * roomCam.projectionMatrix.elements[5] / (renderer.getPixelRatio() * innerHeight);
    renderer.setRenderTarget(rt); renderer.render(room, roomCam); renderer.setRenderTarget(null);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  await Promise.race([document.fonts.load('40px VT323'), new Promise(r => setTimeout(r, 1500))]);
  layout();
  document.fonts.ready.then(layout);
  addEventListener('resize', layout);
  if (route === 'home') {
    orbit.yaw = homeYaw;
    Object.assign(cur, L.home, reduced ? {} : { y: L.home.y - 5 }); // intro: rise up from below with a spin
    if (!reduced) { spin = -TAU; spinT0 = now() + .4; }
  } else { Object.assign(cur, L.cover); Object.assign(scr, { state: 'in', p: 1 }); } // deep link: start zoomed in
  has3d = true;
  frame();
}

go(fromHash());
try { await init3d(); } catch (err) { console.warn('3D disabled:', err); document.body.classList.add('no3d'); }
document.body.classList.add('ready');
</script>
</body>
</html>
